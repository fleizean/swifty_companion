name: peer42
description: "42 Network student profile explorer."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  provider: ^6.1.2
  flutter_dotenv: ^5.2.1
  flutter_secure_storage: ^9.2.2
  go_router: ^14.6.0
  cached_network_image: ^3.4.0
  google_fonts: ^6.2.1
  url_launcher: ^6.3.0
  app_links: ^6.3.0
  lottie: ^3.3.3
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icons/
    - assets/animations/
