name: Build APK and Reminders

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Her ayın 1'inde çalışır (Secret hatırlatması için)
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  build:
    # Schedule event'lerinde build çalışmasın istiyorsak bu condition'ı ekleyebiliriz
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true
      
      - name: Create .env file from secrets
        run: |
          cat > .env << EOF
          CLIENT_ID=${{ secrets.CLIENT_ID }}
          CLIENT_SECRET=${{ secrets.CLIENT_SECRET }}
          REDIRECT_URI=${{ secrets.REDIRECT_URI }}
          EOF
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Analyze code
        run: flutter analyze
        continue-on-error: true
      
      - name: Build APK
        run: flutter build apk --release
      
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d_%H-%M')" >> $GITHUB_OUTPUT
      
      - name: Rename APK with timestamp
        run: |
          mkdir -p apk
          cp build/app/outputs/flutter-apk/app-release.apk apk/swifty-companion-${{ steps.date.outputs.date }}.apk
      
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: swifty-companion-${{ steps.date.outputs.date }}
          path: apk/*.apk
          retention-days: 30
      
      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  remind:
    # Sadece ayın birinde veya manuel tetiklenmede çalışsın
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # ISSUE OLUŞTURMA HATASININ ÇÖZÜMÜ:
    # GITHUB_TOKEN'a "issues: write" yetkisi vermek
    permissions:
      issues: write
      
    steps:
      - name: Create Issue for Secret Update
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔑 42 API Secret Güncelleme Hatırlatması',
              body: `42 API secret'ınızın süresi dolmuş olabilir. Lütfen kontrol edin ve gerekirse güncelleyin:
              
              1. 42 Intra'da yeni secret oluşturun
              2. Repository Settings → Secrets → Actions'a gidin
              3. \`CLIENT_SECRET\` değerini güncelleyin
              
              [Secrets Settings](https://github.com/${context.repo.owner}/${context.repo.repo}/settings/secrets/actions)`,
              labels: ['maintenance', 'security']
            })
